<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Suggestions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', Arial, sans-serif; }
        .suggestion-card { border-radius: 1.2rem; box-shadow: 0 4px 24px #2563eb22; background: #fff; padding: 2rem; max-width: 600px; margin: 3rem auto; }
        .card-title { font-weight: 700; color: #2563eb; font-size: 2rem; }
        .ticket-id { color: #2563eb; font-weight: 700; font-size: 1.1rem; }
        .ai-suggestion { background: #f1f5fb; border-radius: 0.7rem; padding: 1rem; margin-bottom: 1rem; border-left: 4px solid #2563eb; }
        .btn-primary { background: #2563eb; border: none; font-weight: 600; }
        .btn-primary:hover { background: #1e40af; }
    </style>
</head>
<body>
    <div class="suggestion-card">
        <div class="card-title mb-3 text-center">AI Suggestions</div>
        <div class="mb-3 text-center ticket-id">Ticket ID: #{{ ticket_id }}</div>
        <div class="ai-suggestion mb-3">
            <ul class="mb-0">
                {% if ai_suggestions %}
                    {% for suggestion in ai_suggestions %}
                        <li>{{ suggestion }}</li>
                    {% endfor %}
                {% else %}
                    <li>No AI suggestions available.</li>
                {% endif %}
            </ul>
        </div>
        <div class="text-center">
            <a href="/" class="btn btn-primary">Go to Home</a>
        </div>
    </div>
</body>
</html>
