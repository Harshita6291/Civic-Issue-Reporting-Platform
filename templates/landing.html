

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicVoice - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', Arial, sans-serif; }
        .navbar { background: #2563eb; }
        .navbar-brand, .nav-link, .navbar-text { color: #fff !important; font-weight: 600; }
        .nav-link.active { background: #fff; color: #2563eb !important; border-radius: 0.5rem; }
        .main-card { background: #fff; border-radius: 1.2rem; box-shadow: 0 4px 24px #2563eb22; padding: 2rem; margin-top: 2rem; }
        .portal-card { border: none; border-radius: 1.2rem; box-shadow: 0 4px 24px #2563eb22; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; background: #f8fafc; }
        .portal-card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 8px 32px #2563eb44; background: #e0e7ff; }
        .portal-icon { font-size: 2.5rem; margin-bottom: 0.5rem; color: #2563eb; transition: color 0.2s; }
        .portal-card:hover .portal-icon { color: #1e40af; }
        .card-title { font-weight: 700; color: #2563eb; }
        .card-text { color: #334155; }
        @media (max-width: 768px) { .main-card { padding: 1rem; } .portal-icon { font-size: 2rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">CivicVoice</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/citizen">Citizen Portal</a></li>
                    <li class="nav-item"><a class="nav-link" href="/authority">Authority Portal</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="main-card mt-4">
            <h2 class="mb-4 text-center" style="color:#2563eb;font-weight:700;">Welcome to CivicVoice</h2>
            <div class="row justify-content-center g-4">
                <div class="col-md-4 col-12">
                    <a href="/citizen" style="text-decoration:none;">
                        <div class="card portal-card text-center p-4 h-100">
                            <div class="portal-icon">🧑‍💼</div>
                            <div class="card-title">Citizen Portal</div>
                            <div class="card-text">Report civic issues as a resident</div>
                        </div>
                    </a>
                </div>
                <div class="col-md-4 col-12">
                    <a href="/authority" style="text-decoration:none;">
                        <div class="card portal-card text-center p-4 h-100">
                            <div class="portal-icon">🏛️</div>
                            <div class="card-title">Authority Portal</div>
                            <div class="card-text">Monitor and manage issues as an official</div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
