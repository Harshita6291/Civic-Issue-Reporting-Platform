<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Departments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', Arial, sans-serif; }
        .sidebar { background: #2563eb; color: #fff; min-height: 100vh; padding-top: 2rem; }
        .sidebar .nav-link { color: #fff; font-weight: 600; margin-bottom: 1rem; }
        .sidebar .nav-link.active, .sidebar .nav-link:hover { background: #fff; color: #2563eb !important; border-radius: 0.5rem; }
        .main-content { padding: 2rem; }
        .card-title { font-weight: 700; color: #2563eb; }
        .issue-card { border-radius: 1rem; box-shadow: 0 2px 12px #2563eb22; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar">
                <h3 class="mb-4"><i class="fa-solid fa-building-columns"></i> Authority Portal</h3>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/authority">Dashboard</a>
                    <a class="nav-link" href="/authority/issues">Issues</a>
                    <a class="nav-link active" href="/authority/departments">Departments</a>
                </nav>
            </div>
            <div class="col-md-9 main-content">
                <h2 class="card-title mb-4">Departments</h2>
                <div class="card p-3 issue-card">
                    <div class="list-group">
                        <div class="list-group-item">Electrical Department</div>
                        <div class="list-group-item">Water Works Department</div>
                        <div class="list-group-item">Public Works Department</div>
                        <div class="list-group-item">Sanitation Department</div>
                        <div class="list-group-item">Parks & Recreation</div>
                        <div class="list-group-item">Environment</div>
                        <div class="list-group-item">Transport Department</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
