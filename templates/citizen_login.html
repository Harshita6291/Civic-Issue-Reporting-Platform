
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
            font-family: 'Inter', Arial, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 1.2rem;
            max-width: 420px;
            margin: auto;
            margin-top: 3rem;
            padding: 2.5rem 2rem 2rem 2rem;
            background: #fff;
            box-shadow: 0 8px 32px #2563eb22;
        }
        .login-title {
            color: #2563eb;
            font-family: 'Montserrat', Arial, sans-serif;
            font-weight: 700;
            font-size: 2rem;
        }
        .btn-google {
            background: #fff;
            color: #2563eb;
            border: 1.5px solid #2563eb;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }
        .btn-google:hover {
            background: #2563eb;
            color: #fff;
        }
        .otp-input {
            width: 2.5rem;
            text-align: center;
            font-size: 1.5rem;
            margin-right: 0.5rem;
            border-radius: 0.5rem;
            border: 1.5px solid #2563eb;
        }
        .blue-link { color: #2563eb; text-decoration: underline; font-weight: 500; }
        .blue-link:hover { color: #1e40af; }
        .divider {
            border-top: 2px dashed #2563eb33;
            margin: 1.5rem 0;
        }
        @media (max-width: 600px) {
            .login-card { padding: 1.2rem; }
            .login-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="login-card shadow">
        <div class="login-title mb-3 text-center">Citizen Portal Login</div>
        <form method="POST" action="/citizen/login">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2" style="background:#2563eb;">Login</button>
            <button type="button" class="btn btn-google w-100 mb-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" style="width:1.5rem;vertical-align:middle;margin-right:0.5rem;"> Continue with Google
            </button>
            <div class="d-flex justify-content-between mb-2">
                <a href="/citizen/register" class="blue-link">Create Account</a>
                <a href="/citizen/forgot" class="blue-link">Forgot Password?</a>
            </div>
        </form>
        <div class="divider"></div>
    </div>
</body>
</html>
